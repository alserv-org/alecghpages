    <!--
      No og:image here on purpose: the home page has no single product art, and
      a shared default would preview the wrong game. tool/prerender.mjs injects
      an image (and upgrades the card to summary_large_image) only for routes
      that declare one.
    -->
    <meta name="twitter:card" content="summary" />

    <!--
      Paint the stored theme before first render so a dark-mode visitor never
      sees a white flash. Mirrors resolveInitialTheme() in ThemeContext.tsx —
      change one, change the other.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('preferred-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
